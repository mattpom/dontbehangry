<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0806"/>
      <stop offset="100%" style="stop-color:#161410"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Saffron accent bar top -->
  <rect width="1200" height="5" fill="#e8a020"/>
  <!-- Left accent line -->
  <rect x="80" y="60" width="3" height="510" fill="#e8a020" opacity="0.4"/>
  <!-- Main title -->
  <text x="120" y="220" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#e8a020" letter-spacing="-2">DON'T BE</text>
  <text x="120" y="340" font-family="Georgia, serif" font-size="92" font-weight="700" fill="#f7f4ee" letter-spacing="-2">HANGRY.</text>
  <!-- Divider -->
  <line x1="120" y1="380" x2="680" y2="380" stroke="#e8a020" stroke-width="1.5" opacity="0.4"/>
  <!-- Tagline -->
  <text x="120" y="440" font-family="Arial, sans-serif" font-size="26" fill="#c9b89a" letter-spacing="5">SERIOUS FOOD. LIGHT TOUCH.</text>
  <!-- Decorative food circle element -->
  <circle cx="980" cy="315" r="200" fill="none" stroke="#e8a020" stroke-width="1" opacity="0.08"/>
  <circle cx="980" cy="315" r="160" fill="none" stroke="#e8a020" stroke-width="1" opacity="0.06"/>
  <text x="1010" y="365" font-family="serif" font-size="160" fill="#e8a020" opacity="0.08" text-anchor="middle">🍳</text>
  <text x="980" y="380" font-family="Arial, sans-serif" font-size="120" fill="#e8a020" opacity="0.1" text-anchor="middle">✦</text>
  <!-- URL -->
  <text x="120" y="560" font-family="Arial, sans-serif" font-size="20" fill="#e8a020" letter-spacing="3" opacity="0.6">dontbehangry.com</text>
</svg>
