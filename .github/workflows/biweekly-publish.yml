name: Bi-Weekly Content Publisher

on:
  schedule:
    - cron: '0 9 * * 4/14'
  workflow_dispatch:

jobs:
  publish-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and publish draft
        run: |
          if ! ls _drafts/*.html > /dev/null 2>&1; then
            echo "::warning::No drafts found in _drafts/ - add next article before scheduled run"
            exit 0
          fi

          DRAFT=$(ls _drafts/*.html | sort | head -1)
          DRAFT_NAME=$(basename "$DRAFT")

          # Move to root
          cp "$DRAFT" "$DRAFT_NAME"
          rm "$DRAFT"

          # Extract title
          TITLE=$(grep -oP '(?<=<title>)[^<]+' "$DRAFT_NAME" | sed "s/ — Don.*//")
          TODAY=$(date +"%B %-d, %Y")
          TODAY_ISO=$(date +"%Y-%m-%d")

          echo "Publishing: $DRAFT_NAME | $TITLE | $TODAY"

          # Update stories.html - add new article row at top of article-list
          if [ -f stories.html ]; then
            NEW_ROW="              <a href=\"$DRAFT_NAME\" class=\"article-row\"><span class=\"article-date\">$TODAY<\/span><span class=\"article-title\">$TITLE<\/span><span class=\"article-arrow\">&rarr;<\/span><\/a>"
            sed -i "s|class=\"article-list\"|class=\"article-list\">\n$NEW_ROW\n<!--ARTICLELIST|" stories.html
          fi

          # Update archive.html
          if [ -f archive.html ]; then
            ENTRY="              <a href=\"$DRAFT_NAME\" class=\"archive-item\"><time datetime=\"$TODAY_ISO\">$TODAY<\/time><span class=\"archive-title\">$TITLE<\/span><span class=\"archive-arrow\">&rarr;<\/span><\/a>"
            sed -i "s|class=\"archive-list\"|class=\"archive-list\">\n$ENTRY\n<!--ARCHIVELIST|" archive.html
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bi-weekly publish: $DRAFT_NAME [$TODAY_ISO]"
          git push
